<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="facebook-domain-verification" content="5qll8mzhkanayoyttbjq9hw1ynm5s1">
  <title>{{ title or "SwiftInvite" }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">
  {% include "_navbar.html" %}
  <div class="container pb-5">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">{{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button></div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
  <button id="backToTopBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="Back to top"
    style="position:fixed;bottom:24px;right:24px;display:none;z-index:1000;width:44px;height:44px;border-radius:50%;border:none;background:#185a3f;color:#fff;font-size:1.2rem;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer">↑</button>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>const bt=document.getElementById('backToTopBtn');addEventListener('scroll',()=>{bt.style.display=scrollY>300?'block':'none'});</script>
</body>
</html>
