{% extends "base.html" %}
{% set title = "Check-In" %}
{% block content %}
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
.scan{max-width:560px;margin:0 auto}
.scan .seg{display:flex;background:#e5e7eb;border-radius:14px;padding:4px;margin:.6rem 0 .9rem}
.scan .seg button{flex:1;border:0;background:transparent;padding:.7rem;border-radius:11px;font-weight:700;color:#6b7280;min-height:48px}
.scan .seg button.on{background:#fff;color:#185a3f;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.scan .live{background:#fff;border-radius:99px;padding:.3rem .9rem;font-size:.82rem;font-weight:700;color:#185a3f;box-shadow:0 1px 3px rgba(0,0,0,.1)}
#qr-reader{border-radius:18px;overflow:hidden;background:#111;border:0!important;min-height:240px}#qr-reader video{width:100%!important;object-fit:cover;border-radius:18px}
.scan .res{border-radius:16px;padding:1.1rem 1.2rem;margin-top:.9rem;display:flex;gap:.9rem;align-items:flex-start;animation:pop .22s}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
.scan .res .ic{font-size:2.3rem;line-height:1}.scan .res .nm{font-size:1.4rem;font-weight:800;line-height:1.2}.scan .res .ds{font-size:.92rem;color:#374151}
.scan .res.ok{background:#dcfce7;border:2px solid #16a34a}.scan .res.warn{background:#fef3c7;border:2px solid #d97706}.scan .res.err{background:#fee2e2;border:2px solid #dc2626}
.scan .rem{display:inline-block;background:#185a3f;color:#fff;border-radius:99px;padding:.15rem .75rem;font-weight:700;font-size:.82rem;margin-top:.4rem}
.scan .numrow{display:flex;gap:.5rem}.scan .numrow input{flex:1;text-align:center;font-size:1.7rem!important;font-weight:800;letter-spacing:.12em;min-height:62px;min-width:0}
.scan .numrow button{min-width:112px;min-height:62px}.scan .big{width:100%;min-height:58px;font-size:1.1rem;margin-top:.8rem}
.scan .logi{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:12px;padding:.6rem .85rem;margin-bottom:.4rem;box-shadow:0 1px 3px rgba(0,0,0,.07);font-size:.9rem}
.scan .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:.5rem}
</style>
<div class="scan">
  <div class="d-flex justify-content-between align-items-center gap-2">
    <h2 class="mb-0">Check-in</h2>
    <div class="d-flex align-items-center gap-2"><div class="live" id="live">…</div><button class="btn btn-sm btn-outline-secondary" id="mute" title="Sound on/off" data-no-lock>🔊</button></div>
  </div>
  <div class="seg"><button id="tabScan" class="on">📷 Scan QR</button><button id="tabNum">✏️ Card number</button></div>

  <div id="pScan">
    <div id="qr-reader"></div>
    <div class="text-center text-muted small mt-2" id="camHint">Point the camera at the QR code on the guest's card</div>
  </div>
  <div id="pNum" hidden>
    <label class="form-label small text-uppercase text-muted mb-1">Guest card number</label>
    <div class="numrow"><input id="card" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="0042" autocomplete="off"><button class="btn btn-success" id="go">Search</button></div>
  </div>

  <div id="result" aria-live="assertive"></div>
  <h6 class="mt-4 text-uppercase text-muted small">Recent check-ins</h6>
  <div id="log"><div class="text-muted small text-center py-2">No check-ins yet this session</div></div>
</div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let scanner=null,running=false,tab='scan',mute=false,last='',cool=false,pending=null,hideT=null;const log=[];
const pad=n=>String(n||0).padStart(4,'0');
function beep(ok){if(mute)return;try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?880:220;g.gain.value=.12;o.start();o.stop(c.currentTime+(ok?.12:.35))}catch(e){}}
const buzz=ok=>navigator.vibrate&&navigator.vibrate(ok?60:[120,60,120]);
function show(type,icon,name,lines,extra=''){$('result').innerHTML=`<div class="res ${type}"><div class="ic">${icon}</div><div><div class="nm">${esc(name)}</div><div class="ds">${lines}</div>${extra}</div></div>`;
 clearTimeout(hideT);hideT=setTimeout(()=>$('result').innerHTML='',8000);$('result').scrollIntoView({block:'nearest',behavior:'smooth'})}
function outcome(d){const g=d.guest||{};
 if(d.success){const r=g.remaining_entries??'—';beep(true);buzz(true);show('ok','✅',g.name||'Guest',`${esc((g.card_type||'').toUpperCase())} · <b>#${pad(g.visual_id)}</b>`,`<span class="rem">${r} ${r===1?'entry':'entries'} remaining</span>`)}
 else if(d.already_entered){beep(false);buzz(false);show('warn','⚠️','Already fully checked in',`${esc(g.name||'')} — all entries used`)}
 else{beep(false);buzz(false);show('err','❌','Not allowed',esc(d.message||'Unknown error'))}
 addLog(g.name||'?',g.visual_id,!!d.success);stats()}
function addLog(n,v,ok){log.unshift({n,v,ok,t:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})});if(log.length>15)log.pop();
 $('log').innerHTML=log.map(l=>`<div class="logi"><span><span class="dot" style="background:${l.ok?'#185a3f':'#dc2626'}"></span><b>${esc(l.n)}</b> <span class="text-muted">#${pad(l.v)}</span></span><span class="text-muted">${l.t}</span></div>`).join('')}
async function stats(){try{const d=await fetch('/scan_stats').then(r=>r.json());$('live').textContent=`👥 ${d.people_in} / ${d.people_allowed} inside`}catch(e){}}
const post=b=>fetch('/update_status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json());
async function checkIn(b){try{outcome(await post(b))}catch(e){show('err','📶','No connection','Please check your internet and try again.')}}

function setTab(t){tab=t;$('tabScan').classList.toggle('on',t==='scan');$('tabNum').classList.toggle('on',t==='num');$('pScan').hidden=t!=='scan';$('pNum').hidden=t!=='num';$('result').innerHTML='';
 if(t==='scan')start();else{stop();setTimeout(()=>$('card').focus(),50)}}
$('tabScan').onclick=()=>setTab('scan');$('tabNum').onclick=()=>setTab('num');
$('mute').onclick=()=>{mute=!mute;$('mute').textContent=mute?'🔇':'🔊'};

function start(){if(running||typeof Html5Qrcode==='undefined')return;scanner=new Html5Qrcode('qr-reader');
 scanner.start({facingMode:'environment'},{fps:10,aspectRatio:1,qrbox:(w,h)=>{const s=Math.floor(Math.min(w,h)*.72);return{width:s,height:s}}},
  async code=>{if(cool||code===last)return;last=code;cool=true;setTimeout(()=>{cool=false;last=''},3000);await checkIn({qr_code_id:code})},()=>{})
 .then(()=>{running=true;$('camHint').textContent="Point the camera at the QR code on the guest's card"})
 .catch(err=>{scanner=null;$('qr-reader').innerHTML=`<div class="p-4 text-center text-white">📷 Camera unavailable.<br><small>${esc(err)}</small><br><button class="btn btn-light mt-3" onclick="document.getElementById('qr-reader').innerHTML='';start()">Try again</button><br><button class="btn btn-link text-white mt-1" onclick="setTab('num')">Use card number instead</button></div>`})}
function stop(){if(scanner&&running){scanner.stop().then(()=>{running=false;scanner=null}).catch(()=>{})}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else if(tab==='scan')start()});addEventListener('beforeunload',stop);

async function search(){const raw=$('card').value.trim(),n=parseInt(raw,10);if(!raw||isNaN(n)||n<1){$('card').focus();return show('err','❌','Invalid number','Please enter the card number.')}
 const b=$('go');b.disabled=true;b.textContent='…';
 try{const d=await fetch('/lookup_guest?visual_id='+n).then(r=>r.json());
  if(d.found){pending=d.visual_id;const used=d.remaining<=0;
   show(used?'warn':'ok','👤',d.name,`${esc((d.card_type||'').toUpperCase())} · <b>#${pad(d.visual_id)}</b><br>${d.checked_in_count}/${d.group_size} entries used · <b>${d.remaining} remaining</b>`,
    used?'<div class="mt-2 fw-bold">⚠️ All entries already used</div>':'<button class="btn btn-success big" id="confirm">✅ Confirm check-in</button>');
   clearTimeout(hideT);const c=$('confirm');if(c)c.onclick=async()=>{c.disabled=true;await checkIn({visual_id:pending});pending=null;$('card').value='';$('card').focus()}}
  else show('err','❌','Guest not found',`No guest with card number ${n}`)}
 catch(e){show('err','📶','No connection','Could not reach the server.')}
 b.disabled=false;b.textContent='Search'}
$('go').onclick=search;$('card').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
stats();start();
</script>
{% endblock %}
